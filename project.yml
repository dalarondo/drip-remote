name: DripRemote
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.dripremote
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Signs ad hoc ("Sign to Run Locally"), so anyone can build and run without an Apple
    # developer account. scripts/build-release.sh re-signs with a Developer ID for distribution.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  # Vendored copy of itsytv-core (MIT, Nick Ustinov) – see Packages/ItsytvCore/VENDORED.md.
  ItsytvCore:
    path: Packages/ItsytvCore

schemes:
  DripRemote:
    build:
      targets:
        DripRemote: all
        DripRemoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DripRemoteTests
    archive:
      config: Release

targets:
  DripRemote:
    type: application
    platform: macOS
    sources:
      - path: DripRemote
        excludes:
          - DripRemote.entitlements
    settings:
      base:
        INFOPLIST_FILE: DripRemote/Info.plist
        CODE_SIGN_ENTITLEMENTS: DripRemote/DripRemote.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.dripremote.app
        PRODUCT_NAME: "Drip Remote"
        PRODUCT_MODULE_NAME: DripRemote
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - package: ItsytvCore
  # Logic tests without a host app: the menu bar app would start scanning for Apple TVs (and ask
  # for local network access) on every test run. The decision logic in DripRemote/Onboarding, the
  # keyboard shortcuts in DripRemote/Shortcuts and the drip shapes in DripRemote/Island are compiled
  # straight into the test bundle.
  DripRemoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DripRemoteTests
      - path: DripRemote/Onboarding
      - path: DripRemote/Shortcuts
      - path: DripRemote/Island
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dripremote.app.tests
        GENERATE_INFOPLIST_FILE: true
